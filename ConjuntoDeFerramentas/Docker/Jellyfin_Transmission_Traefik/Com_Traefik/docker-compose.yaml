networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
    driver_opts:
      com.docker.network.host_binding_ipv4: "0.0.0.0"

x-logging:
  &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "5"

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.storage=/acme.json"
      - "--serverstransport.insecureskipverify=false"
    networks:
      app_network:
        ipv4_address: 192.168.100.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/stream/traefik/acme.json:/acme.json
    logging: *default-logging
    labels:
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.middlewares.compress.compress.minResponseBodyBytes=1024"
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
      - "traefik.http.middlewares.default-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.default-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.default-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.default-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.default-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.default-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.default-headers.headers.permissionsPolicy=accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'"
      - "traefik.http.middlewares.cache-headers.headers.customResponseHeaders.Cache-Control=private, no-store, must-revalidate"
      - "traefik.http.middlewares.jellyfin-stream.headers.customResponseHeaders.Accept-Ranges=bytes"
    environment:
      - CLOUDFLARE_EMAIL=axr6.forum@gmail.com
      - CLOUDFLARE_API_KEY=9a0a8ada7e27a9f575d738d187df0d35f10f9
      # ou, se estiver usando tokens de API personalizados:
      # - CLOUDFLARE_DNS_API_TOKEN=suatokenpersonalizado
      # - CLOUDFLARE_ZONE_API_TOKEN=suatokenpersonalizado

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.10
    volumes:
      - /opt/stream/jellyfin/config:/config:rw
      - /opt/stream/jellyfin/cache:/cache:rw
      - /home/stream/transmission/downloads/complete:/media:rw
      - type: tmpfs
        target: /opt/stream/jellyfin/cache
        tmpfs:
          size: 20G
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://canela-stream.com.br
      - JELLYFIN_HWACCEL="true"
      - JELLYFIN_CACHECLEANUP=true
      - JELLYFIN_CACHEMAXAGE=3600
      - JELLYFIN_STREAMSEGMENTSIZE=6
      - JELLYFIN_AUDIOMIXDOWN=stereo
      - JELLYFIN_SKIPMETADATAREFRESH=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`canela-stream.com.br`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.secure-headers.headers.permissionsPolicy=accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'"
      - "traefik.http.middlewares.jellyfin-cache.headers.customResponseHeaders.Cache-Control=public, max-age=3600, stale-while-revalidate=600"
      - "traefik.http.middlewares.jellyfin-cache.headers.customResponseHeaders.Pragma=no-cache"
      - "traefik.http.middlewares.jellyfin-stream.headers.customResponseHeaders.Accept-Ranges=bytes"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.5"
        reservations:
          memory: 2G
          cpus: "2.0"

  transmission:
    image: ghcr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.13
    ports:
      - 51413:51413/tcp
      - 51413:51413/udp
      - 9091:9091 # Porta do RPC Web UI
    volumes:
      - /opt/stream/transmission/config:/config:rw # Configuração persistente
      - /home/stream/transmission/downloads:/downloads:rw # Downloads completos
      - /home/stream/transmission/downloads/incomplete:/incomplete:rw # Downloads incompletos
    environment:
      - PUID=${PUID} # ID do usuário para permissões
      - PGID=${PGID} # ID do grupo para permissões
      - TZ=${TZ} # Fuso horário
      - TRANSMISSION_RPC_ENABLED=true # Habilitar RPC
      - TRANSMISSION_RPC_AUTHENTICATION_REQUIRED=true # Habilitar autenticação no RPC
      - TRANSMISSION_RPC_USERNAME=${USER} # Usuário para autenticação RPC
      - TRANSMISSION_RPC_PASSWORD=${PASS} # Senha para autenticação RPC
      - TRANSMISSION_PEER_PORT=51413 # Porta para peers
      - TRANSMISSION_PEER_ENCRYPTION=required # Encriptação obrigatória
      - TRANSMISSION_DOWNLOAD_DIR=/downloads # Diretório de downloads completos
      - TRANSMISSION_INCOMPLETE_DIR=/incomplete # Diretório de downloads incompletos
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED=true # Habilitar diretório de downloads incompletos
      - TRANSMISSION_SPEED_LIMIT_UP=500 # Limite de upload em KBps
      - TRANSMISSION_SPEED_LIMIT_DOWN=2000 # Limite de download em KBps
      - TRANSMISSION_SPEED_LIMIT_UP_ENABLED=true
      - TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED=true
      - TRANSMISSION_RATIO_LIMIT_ENABLED=true # Ativar limite de ratio
      - TRANSMISSION_RATIO_LIMIT=1.5 # Limite de ratio 1.5
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`torrent.canela-stream.com.br`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls.certresolver=cloudflare"
      - "traefik.http.middlewares.compress.compress=true"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"