networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24 # Define a faixa de IP da rede
    driver_opts:
      com.docker.network.host_binding_ipv4: "0.0.0.0"

x-logging:
  &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "5"

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.storage=/acme.json"
      - "--serverstransport.insecureskipverify=false"
    networks:
      app_network:
        ipv4_address: 192.168.100.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/stream/traefik/acme.json:/acme.json
    logging: *default-logging
    labels:
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.middlewares.default-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.default-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.default-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.default-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.default-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.default-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.default-headers.headers.permissionsPolicy=accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'"
      - "traefik.http.middlewares.cache-headers.headers.customResponseHeaders.Cache-Control=max-age=3600, public"
      - "traefik.http.middlewares.cache-headers.headers.customResponseHeaders.Expires=$(date --date='+1 hour' -u +%a, %d %b %Y %T GMT)"
      - "traefik.http.middlewares.cache-headers.headers.customResponseHeaders.Pragma=cache"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.2"

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.10
    volumes:
      - /opt/stream/jellyfin/config:/config:rw
      - /opt/stream/jellyfin/cache:/cache:rw
      - /home/stream/transmission/downloads/complete:/media:rw
      - type: tmpfs
        target: /opt/stream/jellyfin/cache
        tmpfs:
          size: 15G
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://canela-stream.com.br
      - JELLYFIN_HWACCEL="true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`canela-stream.com.br`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.secure-headers.headers.permissionsPolicy=accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'"
      - "traefik.http.middlewares.jellyfin-cache.headers.customResponseHeaders.Cache-Control=max-age=3600, public, immutable"
      - "traefik.http.middlewares.jellyfin-cache.headers.customResponseHeaders.ETag=always"
      - "traefik.http.middlewares.jellyfin-cache.headers.customResponseHeaders.Expires=$(date --date='+1 hour' -u +%a, %d %b %Y %T GMT)"
      - "traefik.http.middlewares.jellyfin-cache.headers.customResponseHeaders.Pragma=cache"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"

  transmission:
    image: ghcr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.13
    ports:
      - 51413:51413/tcp
      - 51413:51413/udp
      - 9091:9091 # Porta padrão para interface web do Transmission
    volumes:
      - /opt/stream/transmission/config:/config:rw
      - /home/stream/transmission/downloads:/downloads:rw
      - /home/stream/transmission/downloads/incomplete:/incomplete:rw
    environment:
      - PUID=${PUID} # User ID para permissões
      - PGID=${PGID} # Group ID para permissões
      - TZ=${TZ} # Timezone
      - TRANSMISSION_WEB_UI=combustion # Interface web alternativa (opcional)
      - USER=${USER} # Usuário para autenticação
      - PASS=${PASS} # Senha para autenticação
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`torrent.canela-stream.com.br`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls.certresolver=cloudflare"
      - "traefik.http.middlewares.compress.compress=true"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"