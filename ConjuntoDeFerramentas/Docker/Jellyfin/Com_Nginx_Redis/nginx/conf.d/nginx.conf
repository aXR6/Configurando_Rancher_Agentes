# Configuração principal
worker_processes auto;
worker_rlimit_nofile 100000;  # Aumentar limite de arquivos abertos para conexões simultâneas

# Bloco events (onde "worker_connections" deve estar)
events {
    worker_connections 4096;  # Máximo de conexões simultâneas por worker
}

# Bloco http (para configurar proxy, gzip, cache, etc.)
http {
    # Incluir tipos MIME padrão
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configurações de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Configuração de gzip para compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;
    gzip_vary on;  # Gzip para navegadores compatíveis
    gzip_proxied any;

    # Configuração de timeouts globais
    proxy_connect_timeout 60s;  # Tempo limite para conectar ao backend
    proxy_read_timeout 300s;    # Tempo limite para leitura de resposta do backend
    proxy_send_timeout 300s;    # Tempo limite para envio de dados ao cliente
    keepalive_timeout 75s;      # Conexões persistentes com o cliente

    # Diretórios de cache
    proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:1024m max_size=20g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/transmission levels=1:2 keys_zone=transmission_cache:512m max_size=10g inactive=30m use_temp_path=off;

    # Monitoramento de cache para logs
    log_format cache_log '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" Cache: $upstream_cache_status';
    access_log /var/log/nginx/cache.log cache_log;

    # Configurações de buffers para proxy
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_temp_file_write_size 64k;

    # Cache stale: usar conteúdo expirado em caso de erro
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Incluir arquivos adicionais de configuração
    include /etc/nginx/conf.d/*.conf;
}