# Configuração principal
worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs de acesso e erros
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Compressão GZIP
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # Tempo limite de conexão
    proxy_connect_timeout 90s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    keepalive_timeout 90s;

    # Configuração de cache
    proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:1024m max_size=20g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/transmission levels=1:2 keys_zone=transmission_cache:512m max_size=10g inactive=30m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/jackett levels=1:2 keys_zone=jackett_cache:512m max_size=5g inactive=30m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/openvpn levels=1:2 keys_zone=openvpn_cache:512m max_size=5g inactive=30m use_temp_path=off;

    # Formato de log com status do cache
    log_format cache_log '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" Cache: $upstream_cache_status';
    access_log /var/log/nginx/cache.log cache_log;

    # Configuração de buffers
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_temp_file_write_size 64k;

    # Cache stale: usar conteúdo expirado em caso de erro
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Remover informações do servidor
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}