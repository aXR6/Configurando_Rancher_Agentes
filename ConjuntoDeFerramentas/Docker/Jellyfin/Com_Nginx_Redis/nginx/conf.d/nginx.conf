worker_processes auto;

events {
    worker_connections 4096; # Aumentado para lidar com mais conexões simultâneas
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log crit;

    server_tokens off;

    # Cache para Jellyfin (vídeo e áudio)
    proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:1g max_size=20g inactive=1h use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 2; # Armazena após 2 acessos
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Cache para Transmission (rápido acesso às páginas)
    proxy_cache_path /var/cache/nginx/transmission levels=1:2 keys_zone=transmission_cache:512m max_size=10g inactive=1h use_temp_path=off;

    # Buffers e otimizações gerais
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 256k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}