# Configuração principal
worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 8192;  # Conexões simultâneas aumentadas
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs com timestamps ISO 8601
    log_format main '$remote_addr - $remote_user [$time_iso8601] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Melhorar segurança HTTP
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    keepalive_timeout 75s;

    # Cache
    proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:1024m max_size=20g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/transmission levels=1:2 keys_zone=transmission_cache:512m max_size=10g inactive=30m use_temp_path=off;

    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 128k;

    include /etc/nginx/conf.d/*.conf;
}