worker_processes auto;

events {
    worker_connections 4096; # Suporte para mais conexões simultâneas
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log crit;

    server_tokens off;

    # Cache proxy tradicional para fallback
    proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:1024m max_size=15g inactive=30m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/transmission levels=1:2 keys_zone=transmission_cache:512m max_size=10g inactive=15m use_temp_path=off;

    # Configuração de Memcached como backend
    upstream memcached_backend {
        server 192.168.100.12:11211; # Servidor Memcached
        keepalive 32; # Conexões persistentes para desempenho
    }

    # Configurações globais de proxy
    proxy_cache_methods GET HEAD;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";

    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;

    include /etc/nginx/conf.d/*.conf;
}