# Redirecionamento HTTP para HTTPS
server {
    listen 80 default_server;
    server_name canela-stream.com.br www.canela-stream.com.br torrent.canela-stream.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name _;

    return 444;  # Bloqueia conexões inesperadas
}

# Configuração HTTPS para Jellyfin
server {
    listen 443 ssl http2;
    server_name canela-stream.com.br www.canela-stream.com.br;

    # Certificados SSL
    ssl_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Melhorar segurança HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self';";

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Rota principal para Jellyfin
    location / {
        proxy_pass http://192.168.100.10:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configurações específicas de streaming
        proxy_no_cache $http_range $http_authorization;
        proxy_cache_bypass $http_range $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Configuração para arquivos multimídia
    location ~* \.(mp4|mkv|webm|jpg|jpeg|png|gif)$ {
        proxy_pass http://192.168.100.10:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Controle de cache e suporte a partial content
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Cache-Status $upstream_cache_status;

        # Limitar taxa de download por cliente (5MB/s)
        limit_rate 5m;
    }

    error_log /var/log/nginx/jellyfin-error.log warn;
    access_log /var/log/nginx/jellyfin-access.log;
}

# Configuração HTTPS para Transmission
server {
    listen 443 ssl http2;
    server_name torrent.canela-stream.com.br;

    # Certificados SSL
    ssl_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Melhorar segurança HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Rota principal para Transmission
    location / {
        proxy_pass http://192.168.100.13:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache transmission_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Controle de requisições por IP
        limit_req zone=req_limit burst=10 nodelay;
    }

    error_log /var/log/nginx/transmission-error.log warn;
    access_log /var/log/nginx/transmission-access.log;
}

# Configuração de zona de limite de requisições
http {
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=5r/s;
}