# Configuração principal
worker_processes auto;  # Número de processos de trabalho baseado na CPU disponível

# Limitar o número de arquivos abertos por processo
worker_rlimit_nofile 100000;

events {
    worker_connections 1024;  # Limite de conexões por worker
    use epoll;  # Melhor desempenho para sistemas Linux
    multi_accept on;  # Aceitar múltiplas conexões simultaneamente
}

http {
    # Inclui tipos MIME padrão
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Ocultar versão do NGINX
    server_tokens off;

    # Configuração de compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;
    gzip_vary on;  # Ajuste para navegadores compatíveis
    gzip_proxied any;

    # Configuração de cache
    proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:1024m max_size=20g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/transmission levels=1:2 keys_zone=transmission_cache:512m max_size=10g inactive=30m use_temp_path=off;

    # Cache para erros e atualizações
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Configurações de buffer
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Diretiva para limitar requisições
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=5r/s;

    # Configuração de DNS
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Inclui configurações específicas de servidores
    include /etc/nginx/conf.d/*.conf;
}