server {
    listen 80;
    server_name localhost;

    # Tentar primeiro carregar do cache Memcached
    location / {
        default_type text/html;

        # Consultar o cache Memcached
        set $memcached_key $uri;
        memcached_pass memcached_cache:11211;

        # Configuração de fallback para o Jellyfin
        error_page 404 = @fallback;
    }

    # Rota fallback para o Jellyfin
    location @fallback {
        proxy_pass http://jellyfin:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache de resposta no Memcached
        add_header X-Cache-Status MISS;
        proxy_cache_key $uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
    }
}