# Redirecionamento HTTP para HTTPS
server {
    listen 80;
    server_name canela-stream.com.br www.canela-stream.com.br torrent.canela-stream.com.br;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://$host$request_uri;
}

# Configuração HTTPS para Jellyfin
server {
    listen 443 ssl;
    http2 on;
    server_name canela-stream.com.br www.canela-stream.com.br;

    ssl_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; script-src 'self'; style-src 'self';";

    location / {
        proxy_pass http://192.168.100.10:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache $http_range $http_authorization;
        proxy_cache_bypass $http_range $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location ~* \.(mp4|mkv|webm|jpg|jpeg|png|gif)$ {
        proxy_pass http://192.168.100.10:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Cache-Status $upstream_cache_status;
    }

    error_log /var/log/nginx/jellyfin-error.log warn;
    access_log /var/log/nginx/jellyfin-access.log;
}

# Configuração HTTPS para Transmission
server {
    listen 443 ssl;
    http2 on;
    server_name torrent.canela-stream.com.br;

    ssl_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:;";

    location / {
        proxy_pass http://192.168.100.13:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache transmission_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_log /var/log/nginx/transmission-error.log warn;
    access_log /var/log/nginx/transmission-access.log;
}