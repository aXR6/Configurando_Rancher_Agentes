# Redirecionamento HTTP para HTTPS
server {
    listen 80;
    server_name canela-stream.com.br www.canela-stream.com.br torrent.canela-stream.com.br;

    return 301 https://$host$request_uri;
}

# Configuração HTTPS para Jellyfin
server {
    listen 443 ssl http2;
    server_name canela-stream.com.br www.canela-stream.com.br;

    # Certificados SSL
    ssl_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Configuração de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Configuração Proxy para Jellyfin
    location / {
        proxy_pass http://192.168.100.10:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache configurado
        proxy_cache jellyfin_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_authorization;

        # Configuração de conexões persistentes e suporte a streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;
        proxy_temp_file_write_size 128k;

        # Garantir suporte a streaming parcial
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Cache-Status $upstream_cache_status;

        # Logs
        access_log /var/log/nginx/jellyfin-access.log;
        error_log /var/log/nginx/jellyfin-error.log warn;
    }

    # Cache específico para arquivos multimídia
    location ~* \.(mp4|mkv|webm|jpg|jpeg|png|gif)$ {
        proxy_pass http://192.168.100.10:8096;
        proxy_cache jellyfin_cache;
        proxy_cache_valid 200 302 30m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_authorization;

        # Logs detalhados de cache
        add_header X-Cache-Status $upstream_cache_status;

        # Streaming parcial
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        access_log /var/log/nginx/jellyfin-media-access.log;
        error_log /var/log/nginx/jellyfin-media-error.log warn;
    }
}

# Configuração HTTPS para Transmission
server {
    listen 443 ssl http2;
    server_name torrent.canela-stream.com.br;

    # Certificados SSL
    ssl_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    location / {
        proxy_pass http://192.168.100.13:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache transmission_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        access_log /var/log/nginx/transmission-access.log;
        error_log /var/log/nginx/transmission-error.log warn;
    }
}