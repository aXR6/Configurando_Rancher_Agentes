worker_processes auto;
worker_connections 2048;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_disable "msie6";

    # Diretório de cache para arquivos estáticos
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:20m inactive=24h max_size=2g;

    # Configuração do Redis como backend
    upstream redis_backend {
        server jellyfin_redis:6379;
    }

    # Backend do Jellyfin
    upstream jellyfin_backend {
        server localhost:8096;
    }

    include /etc/nginx/conf.d/*.conf;
}