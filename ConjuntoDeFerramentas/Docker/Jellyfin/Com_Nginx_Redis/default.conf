# Define o caminho do cache e as configurações relacionadas
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=jellyfin_cache:128m max_size=10g inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://jellyfin:8096;  # Encaminha o tráfego para o Jellyfin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuração de cache
        proxy_cache jellyfin_cache;
        proxy_cache_valid 200 302 60m;   # Respostas válidas por 60 minutos
        proxy_cache_valid 404 1m;        # Respostas 404 válidas por 1 minuto
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Cache-Control para otimização
        add_header Cache-Control "public, max-age=60";

        # Otimização
        proxy_buffering on;
        proxy_buffers 32 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 1024m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}