networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24 # Define a faixa de IP da rede

x-logging:
  &default-logging
  driver: "local"
  options:
    max-size: "5m"
    max-file: "3"

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.storage=/acme.json"
      - "--serverstransport.insecureskipverify=true"
    networks:
      app_network:
        ipv4_address: 192.168.100.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/stream/traefik/acme.json:/acme.json
    logging: *default-logging

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.10
    volumes:
      - /home/stream/jellyfin/config:/config:rw # Dados de configuração persistentes
      - /opt/stream/jellyfin/cache:/cache:rw # Cache temporário usado pela aplicação
      - /home/stream/transmission/downloads/complete:/media:ro # Biblioteca de mídia
      - type: tmpfs
        target: /cache
        tmpfs:
          size: 10G
    devices:
      - /dev/dri:/dev/dri # Intel Quick Sync para transcodificação
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://canela-stream.com.br
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`canela-stream.com.br`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  transmission:
    image: ghcr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      app_network:
        ipv4_address: 192.168.100.13
    volumes:
      - /home/stream/transmission/config:/config:rw
      - /home/stream/transmission/downloads:/downloads:rw,async,noatime,nodiratime
      - /home/stream/transmission/incomplete:/incomplete:rw,async,noatime,nodiratime
      - /opt/stream/transmission/logs:/var/log/transmission:rw
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${USER}
      - PASS=${PASS}
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`torrent.canela-stream.com.br`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls.certresolver=cloudflare"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"