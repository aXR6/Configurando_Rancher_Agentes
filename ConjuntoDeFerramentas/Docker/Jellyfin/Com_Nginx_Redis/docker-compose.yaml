version: "3.9"
networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.10
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://canela-stream.com.br
    volumes:
      - /home/stream/jellyfin/config:/config
      - /opt/stream/jellyfin/cache:/cache
      - /home/stream/transmission/downloads/complete:/media
      - type: tmpfs
        target: /opt/stream/jellyfin/cache
        tmpfs:
          size: 10G
    devices:
      - /dev/dri:/dev/dri
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.11
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/stream/nginx/conf.d:/etc/nginx/conf.d
      - /home/stream/nginx/certs:/etc/nginx/certs
      - /opt/stream/nginx/logs:/var/log/nginx
      - /opt/stream/nginx/cache:/var/cache/nginx
      - /home/stream/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - memcached
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 256m

  memcached:
    image: memcached:1.6
    container_name: memcached_cache
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.12
    ports:
      - "11211:11211"
    command: ["memcached", "-m", "512", "-c", "2048", "-v"]
    volumes:
      - /opt/stream/memcached/logs:/var/log/memcached
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.2"
        reservations:
          memory: 128m

  transmission:
    image: ghcr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${USER}
      - PASS=${PASS}
    volumes:
      - /home/stream/transmission/config:/config:ro
      - /home/stream/transmission/downloads:/downloads:rw,async,noatime,nodiratime
      - /home/stream/transmission/incomplete:/incomplete:rw,async,noatime,nodiratime
      - /opt/stream/transmission/logs:/var/log/transmission
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "local"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      app_network:
        ipv4_address: 192.168.100.13