services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - jellyfin_network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - JELLYFIN_PublishedServerUrl=http://jellyfin:8096
    volumes:
      - /home/stream/jellyfin/config:/config
      - /home/stream/jellyfin/cache:/cache
      - /home/stream/transmission/downloads/complete:/media
      - type: tmpfs
        target: /home/stream/jellyfin/cache
        tmpfs:
          size: 512m
      - type: tmpfs
        target: /home/stream/jellyfin/cache/thumbnails
        tmpfs:
          size: 256m
    devices:
      - /dev/dri:/dev/dri
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G

  nginx:
    image: nginx-with-redis
    container_name: jellyfin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/stream/nginx/conf.d:/etc/nginx/conf.d
      - /home/stream/nginx/conf:/etc/nginx/conf
      - /home/stream/nginx/logs:/var/log/nginx
      - /home/stream/nginx/ssl:/etc/nginx/ssl
      - /var/cache/nginx:/var/cache/nginx
    depends_on:
      - redis
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=2048
    networks:
      - jellyfin_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"

  redis:
    image: redis:latest
    container_name: jellyfin_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "sua_senha_segura", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /home/stream/redis/data:/data
    networks:
      - jellyfin_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M

networks:
  jellyfin_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500