version: '3.9'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/stream/nginx/conf.d:/etc/nginx/conf.d        # Configuração personalizada do Nginx
      - /home/stream/nginx/cache:/var/cache/nginx          # Cache persistente do Nginx
      - /home/stream/nginx/logs:/var/log/nginx             # Logs do Nginx
    networks:
      - media_network
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - JELLYFIN_PublishedServerUrl=http://jellyfin:8096
    volumes:
      - /home/stream/jellyfin/config:/config
      - /home/stream/jellyfin/cache:/cache
      - /home/stream/transmission/downloads/complete:/media
      - type: tmpfs
        target: /home/stream/jellyfin/cache
        tmpfs:
          size: 512m
      - type: tmpfs
        target: /home/stream/jellyfin/cache/thumbnails
        tmpfs:
          size: 256m
    devices:
      - /dev/dri:/dev/dri
    networks:
      - media_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G

networks:
  media_network:
    driver: bridge