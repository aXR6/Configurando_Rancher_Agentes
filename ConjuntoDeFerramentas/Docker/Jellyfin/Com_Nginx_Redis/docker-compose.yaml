networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.10
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://canela-stream.com.br
    volumes:
      - /home/stream/jellyfin/config:/config:rw
      - /opt/stream/jellyfin/cache:/cache:rw
      - /home/stream/transmission/downloads/complete:/media:ro
      - type: tmpfs
        target: /opt/stream/jellyfin/cache
        tmpfs:
          size: 10G
    devices:
      - /dev/dri:/dev/dri
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    # Para a solução 1 (cache indireto), use nginx:alpine
    # Para a solução 2 (redis_pass), altere para nginx-custom:latest (veja o Dockerfile abaixo)
    image: nginx-custom:latest
    container_name: nginx_proxy
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.11
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/stream/nginx/conf.d:/etc/nginx/conf.d:rw
      - /home/stream/nginx/certs:/etc/nginx/certs:rw
      - /opt/stream/nginx/logs:/var/log/nginx:rw
      - /opt/stream/nginx/cache:/var/cache/nginx:rw
      - /home/stream/nginx/nginx.conf:/etc/nginx/nginx.conf:rw
    depends_on:
      - redis
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.12
    ports:
      - "6379:6379"
    volumes:
      - /opt/stream/redis/data:/data:rw
    command: ["redis-server", "--appendonly", "yes"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  transmission:
    image: ghcr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${USER}
      - PASS=${PASS}
    volumes:
      - /home/stream/transmission/config:/config:rw
      - /home/stream/transmission/downloads:/downloads:rw,async,noatime,nodiratime
      - /home/stream/transmission/incomplete:/incomplete:rw,async,noatime,nodiratime
      - /opt/stream/transmission/logs:/var/log/transmission:rw
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      app_network:
        ipv4_address: 192.168.100.13
