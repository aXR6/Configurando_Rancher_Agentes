networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.email=${CLOUDFLARE_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/acme.json"
      - "--serverstransport.insecureskipverify=true"
    networks:
      app_network:
        ipv4_address: 192.168.100.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/stream/traefik/acme.json:/acme.json
    environment:
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(\"traefik.canela-stream.com.br\")"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.tls.certresolver=cloudflare"

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 192.168.100.10
    volumes:
      - /home/stream/jellyfin/config:/config:rw
      - /opt/stream/jellyfin/cache:/cache:rw
      - /home/stream/transmission/downloads/complete:/media:ro
      - type: tmpfs
        target: /opt/stream/jellyfin/cache
        tmpfs:
          size: 10G
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://canela-stream.com.br
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(\"canela-stream.com.br\")"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.jellyfin-secure-headers.headers.permissionsPolicy=accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-secure-headers"