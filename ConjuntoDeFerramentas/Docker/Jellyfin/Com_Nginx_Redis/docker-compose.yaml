networks:
  app_network:
    driver: bridge

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - app_network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - JELLYFIN_PublishedServerUrl=http://192.168.3.202:8096
    volumes:
      - /home/stream/jellyfin/config:/config
      - /home/stream/jellyfin/cache:/cache
      - /home/stream/transmission/downloads/complete:/media

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_proxy
    restart: unless-stopped
    networks:
      - app_network
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - jellyfin
      - redis

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: unless-stopped
    networks:
      - app_network
    ports:
      - "6379:6379"