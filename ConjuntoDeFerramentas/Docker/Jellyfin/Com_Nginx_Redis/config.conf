worker_processes auto;
worker_connections 1024;

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_disable "msie6";

    # Diretório de cache para arquivos estáticos
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=1g;

    # Configuração do Redis como backend
    upstream redis_backend {
        server jellyfin_redis:6379; # Conecta ao serviço Redis no Docker
    }

    upstream jellyfin_backend {
        server localhost:8096;
    }

    server {
        listen 80;
        server_name jellyfin.local;

        # Cache baseado em Redis para solicitações
        location / {
            set $redis_key $uri;
            redis_pass redis_backend; # Envia as solicitações ao Redis
            default_type application/json;
            add_header X-Cache-Status $upstream_cache_status;

            # Headers de segurança
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-XSS-Protection "1; mode=block";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self';";
        }

        # Proxy para arquivos dinâmicos ou não encontrados no Redis
        location /media/ {
            proxy_pass http://jellyfin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache STATIC;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Cache para arquivos estáticos (imagens, CSS, JS, etc.)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public";
        }

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}