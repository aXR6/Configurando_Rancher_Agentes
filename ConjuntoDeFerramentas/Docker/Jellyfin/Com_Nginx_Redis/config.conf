proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:20m inactive=24h max_size=10g;

server {
    listen 80;
    server_name jellyfin.local;

    # Cache para todas as solicitações
    location / {
        proxy_pass http://jellyfin_backend;
        proxy_cache STATIC;
        proxy_cache_valid 200 1h; # Cache para respostas HTTP 200 por 1 hora
        proxy_cache_valid 404 1m; # Cache para respostas HTTP 404 por 1 minuto
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Cache-Status $upstream_cache_status;

        # Headers de segurança
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self';";
    }

    # Cache para arquivos estáticos (imagens, CSS, JS, etc.)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Configuração de erros
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}