# Diretório de cache em disco
proxy_cache_path /var/cache/nginx/jellyfin levels=1:2 keys_zone=jellyfin_cache:10m max_size=10g inactive=60m use_temp_path=off;
proxy_cache_path /var/cache/nginx/transmission levels=1:2 keys_zone=transmission_cache:10m max_size=10g inactive=60m use_temp_path=off;

# Configuração de compressão Gzip
gzip on;
gzip_types text/plain application/xml text/css application/javascript application/json image/svg+xml;
gzip_proxied any;
gzip_min_length 1024;

# Redirecionamento HTTP para HTTPS
server {
    listen 80;
    server_name canela-stream.com.br www.canela-stream.com.br torrent.canela-stream.com.br;

    # Redireciona todas as requisições HTTP para HTTPS
    return 301 https://$host$request_uri;
}

# Configuração HTTPS para Jellyfin
server {
    listen 443 ssl http2;
    server_name canela-stream.com.br www.canela-stream.com.br;

    # Certificados SSL fornecidos pelo Cloudflare
    ssl_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Configurações de segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cabeçalhos de segurança recomendados
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header X-XSS-Protection "1; mode=block";

    # Configuração para obter os IPs reais via Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Configuração do Proxy para o Jellyfin
    location / {
        proxy_pass http://192.168.100.10:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configurações de cache em disco
        proxy_cache jellyfin_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;

        # Configurações de tempo limite
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Evita buffering
        proxy_buffering off;

        # Suporte a WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Logs para diagnóstico
    error_log /var/log/nginx/jellyfin-error.log warn;
    access_log /var/log/nginx/jellyfin-access.log;
}

