version: '3.8'

networks:
  nextcloud_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  nextcloud:
    image: nextcloud:30.0.2
    container_name: nextcloud
    environment:
      - MYSQL_HOST=nextcloud_db                  # Host do MariaDB
      - MYSQL_DATABASE=nextcloud                 # Nome do banco de dados que será criado automaticamente
      - MYSQL_USER=nextcloud                     # Nome do usuário do banco de dados que será criado automaticamente
      - MYSQL_PASSWORD=36HBpD61l)Lj              # Senha do usuário do banco de dados
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY_CONSUMPTION=128
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.2
    depends_on:
      - db
      - redis

  db:
    image: mariadb:latest
    container_name: nextcloud_db
    environment:
      - MYSQL_ROOT_PASSWORD=36HBpD61l)Lj         # Senha para o usuário root do MariaDB
      - MYSQL_DATABASE=nextcloud                 # Nome do banco de dados para o Nextcloud
      - MYSQL_USER=nextcloud                     # Nome do usuário do banco de dados
      - MYSQL_PASSWORD=36HBpD61l)Lj              # Senha para o usuário do banco de dados
    volumes:
      - /home/stream/nextcloud/db:/var/lib/mysql # Volume para persistência de dados do MariaDB
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.3

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    command: redis-server --requirepass senha_redis
    volumes:
      - /home/stream/nextcloud/redis:/data       # Volume para persistência de dados do Redis
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.4

  web:
    image: nginx:alpine
    container_name: nextcloud_nginx
    volumes:
      - /home/stream/nextcloud/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "192.168.3.202:80:80"                    # Porta mapeada para acesso externo ao Nginx
    depends_on:
      - nextcloud
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.5