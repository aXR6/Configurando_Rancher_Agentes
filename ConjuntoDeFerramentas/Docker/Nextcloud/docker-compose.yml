version: '3.8'

networks:
  nextcloud_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  nextcloud:
    image: nextcloud:30.0.2
    container_name: nextcloud
    environment:
      - POSTGRES_HOST=nextcloud_db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=abc123
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY_CONSUMPTION=128
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.2
    depends_on:
      - db
      - redis

  db:
    image: postgres:latest
    container_name: nextcloud_db
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=abc123
    volumes:
      - /home/stream/nextcloud/db:/var/lib/postgresql/data
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.3

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    command: redis-server --requirepass senha_redis
    volumes:
      - /home/stream/nextcloud/redis:/data
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.4

  web:
    image: nginx:alpine
    container_name: nextcloud_nginx
    volumes:
      - /home/stream/nextcloud/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "192.168.3.202:80:80"
    depends_on:
      - nextcloud
    networks:
      nextcloud_network:
        ipv4_address: 192.168.100.5