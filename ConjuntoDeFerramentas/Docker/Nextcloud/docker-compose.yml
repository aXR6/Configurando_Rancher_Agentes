services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=senha_segura
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY_CONSUMPTION=128
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    volumes:
      - /home/stream/nextcloud/data:/var/www/html/data
      - /home/stream/nextcloud/config:/var/www/html/config
      - /home/stream/nextcloud/apps:/var/www/html/custom_apps
      - /home/stream/nextcloud/logs:/var/www/html/nextcloud.log
    depends_on:
      - db
      - redis
    #deploy:
      #resources:
        #limits:
          #cpus: '1.0'
          #memory: 1G

  db:
    image: postgres:latest
    container_name: nextcloud_db
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=senha_segura
    volumes:
      - /home/stream/nextcloud/db:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    command: redis-server --requirepass senha_redis
    volumes:
      - /home/stream/nextcloud/redis:/data

  web:
    image: nginx:alpine
    container_name: nextcloud_nginx
    volumes:
      - /home/stream/nextcloud/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nextcloud

volumes:
  nextcloud_data:
  nextcloud_db:
  nextcloud_redis: