services:
  transmission:
    image: ghcr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000             # ID do usuário no host
      - PGID=1000             # ID do grupo no host
      - TZ=America/Sao_Paulo  # Fuso horário
      - USER=stream           # (Opcional) Usuário para autenticação RPC
      - PASS=123abc           # (Opcional) Senha para autenticação RPC
    volumes:
      - /home/stream/Transmission/config:/config                # Configurações do Transmission
      - /home/stream/transmission/downloads:/downloads          # Diretório de downloads
      - /home/stream/transmission/watch:/watch                  # Diretório para monitorar torrents
      - /home/stream/transmission/incomplete:/incomplete        # Diretório para downloads incompletos
      #- /home/stream/transmission/www:/www                     # Interface web personalizada
    ports:
      - "9091:9091"           # Interface web do Transmission
      - "51413:51413"         # Porta P2P TCP
      - "51413:51413/udp"     # Porta P2P UDP
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - torrent_network

  flood:
    image: linuxserver/flood:latest
    container_name: flood
    environment:
      - PUID=1000                  # ID do usuário no host
      - PGID=1000                  # ID do grupo no host
      - TZ=America/Sao_Paulo       # Fuso horário
      - FLOOD_PASSWORD=senha_flood # Senha para acessar a interface Flood
      - TRANSMISSION_HOST=transmission
      - TRANSMISSION_PORT=9091
      - TRANSMISSION_USER=stream   # Deve corresponder ao USER definido no Transmission
      - TRANSMISSION_PASS=123abc   # Deve corresponder ao PASS definido no Transmission
    volumes:
      - /home/stream/transmission/configflood:/config   # Configurações do Flood
    ports:
      - "3000:3000"                # Porta para acessar a interface Flood
    restart: unless-stopped
    depends_on:
      - transmission
    networks:
      - torrent_network

networks:
  torrent_network:
    driver: bridge